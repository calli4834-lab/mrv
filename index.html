<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프론트 대시보드</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
        }
        /* 왼쪽 고정 메뉴바 */
        .sidebar {
            width: 280px;
            background-color: #1e1e1e;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            height: 100vh;
        }
        .sidebar h1 {
            font-size: 1.2rem;
            color: #ffffff;
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .section {
            margin-bottom: 20px;
        }
        .section h2 {
            font-size: 0.95rem;
            color: #bb86fc;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn {
            background-color: #2d2d2d;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #3700b3;
        }
        /* 오른쪽 사이트가 열리는 메인 화면 */
        .main-viewer {
            flex: 1;
            height: 100vh;
            background-color: #000000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- 왼쪽 고정 메뉴바 -->
    <div class="sidebar">
        <h1>🏨 야간 프론트</h1>

        <div class="section">
            <h2>메뉴 1 (예약·객실)</h2>
            <div class="btn-list">
                <a href="https://www.google.com" target="content-frame" class="btn">PMS 시스템</a>
                <a href="https://www.google.com" target="content-frame" class="btn">객실 현황표</a>
                <a href="https://www.google.com" target="content-frame" class="btn">OTA 관리 사이트</a>
            </div>
        </div>

        <div class="section">
            <h2>메뉴 2 (정산·결제)</h2>
            <div class="btn-list">
                <a href="https://www.google.com" target="content-frame" class="btn">카드 단말기 정산</a>
                <a href="https://www.google.com" target="content-frame" class="btn">야간 매출 보고서</a>
                <a href="https://www.google.com" target="content-frame" class="btn">환불 및 취소 관리</a>
            </div>
        </div>

        <div class="section">
            <h2>메뉴 3 (근무·기타)</h2>
            <div class="btn-list">
                <a href="https://www.google.com" target="content-frame" class="btn">인수인계서</a>
                <a href="https://www.google.com" target="content-frame" class="btn">택배 / 비품 대장</a>
                <a href="https://www.google.com" target="content-frame" class="btn">호텔 사내망</a>
            </div>
        </div>
    </div>

    <!-- 오른쪽 화면 영역 (클릭한 사이트가 여기에 뜸) -->
    <div class="main-viewer">
        <iframe name="content-frame" src="about:blank"></iframe>
    </div>

</body>
</html>
