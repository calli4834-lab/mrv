<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호텔 프론트 대시보드</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .section {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .section h2 {
            font-size: 1.2rem;
            color: #bb86fc;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            background-color: #2d2d2d;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #3700b3;
        }
    </style>
</head>
<body>

    <h1>🏨 야간 프론트 업무 대시보드</h1>

    <div class="container">
        <!-- 메뉴 1 -->
        <div class="section">
            <h2>메뉴 1 (예약·객실)</h2>
            <div class="btn-list">
                <a href="https://www.google.com" class="btn">CMS</a>
                <a href="https://www.google.com" class="btn">PMS</a>
                <a href="https://www.google.com" class="btn">예약메일</a>
            </div>
        </div>

        <!-- 메뉴 2 -->
        <div class="section">
            <h2>메뉴 2 (정산·결제)</h2>
            <div class="btn-list">
                <a href="https://www.google.com" class="btn">카드 단말기 정산</a>
                <a href="https://www.google.com" class="btn">야간 매출 보고서</a>
                <a href="https://www.google.com" class="btn">환불 및 취소 관리</a>
            </div>
        </div>

        <!-- 메뉴 3 -->
        <div class="section">
            <h2>메뉴 3 (근무·기타)</h2>
            <div class="btn-list">
                <a href="https://www.google.com" class="btn">인수인계서</a>
                <a href="https://www.google.com" class="btn">택배 / 비품 대장</a>
                <a href="https://www.google.com" class="btn">호텔 사내망</a>
            </div>
        </div>
    </div>

</body>
</html>
